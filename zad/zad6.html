<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Przelicznik Walut</title>
</head>
<body>
    Wpisz temeraturę w Celcjuszach: <br>
    <input type="number" id="user_number"> C
    
    <select id="wybor">
        <option value="Celcjusze">Celcjusze</option>
        <option value="Farenheit">Farenheit</option>
        <option value="Kelwin">Kelwin</option>
    </select>

    <button onclick="przelicz()">Przelicz</button>

    <br>
    Wynik: <input readonly id="wynik">

    <script>
        function przelicz() {
            let number = document.getElementById("user_number").value;
            let wybor = document.getElementById("wybor").value;
            let poleWynik = document.getElementById("wynik");

            let wynik_licz = 0;

            if (wybor == "Celcjusze") {
                wynik_licz = number; 
                poleWynik.value = wynik_licz;
            } 
            else if (wybor == "Farenheit") {
                wynik_licz = ((number * 9/5) +32); 
                poleWynik.value = wynik_licz + " F";
            } 
            else if (wybor == "Kelwin") {
                wynik_licz = (+number + 273.15);
                poleWynik.value = wynik_licz + " K";
            }
        }
    </script>
</body>
</html>
