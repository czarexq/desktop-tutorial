<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Przelicznik Walut</title>
</head>
<body>
    Wpisz ilość złotówek i wybierz walutę do przeliczenia: <br>
    <input type="number" id="user_number"> zł
    
    <select id="wybor">
        <option value="euro">euro</option>
        <option value="dolar">dolar</option>
        <option value="frank">frank</option>
    </select>

    <button id="button1" onclick="przelicz()">Przelicz</button>
    <br><br>
    
    Wynik: <input readonly id="wynik">

    <script>
        function przelicz() {
            let kwota = document.getElementById("user_number").value;
            let wybor = document.getElementById("wybor").value;
            let poleWynik = document.getElementById("wynik");

            let przeliczonaKwota = 0;

            if (wybor == "euro") {
                przeliczonaKwota = kwota / 4.30; 
                poleWynik.value = przeliczonaKwota + " €";
            } 
            else if (wybor == "dolar") {
                przeliczonaKwota = kwota / 4.00; 
                poleWynik.value = przeliczonaKwota + " $";
            } 
            else if (wybor == "frank") {
                przeliczonaKwota = kwota / 4.50;
                poleWynik.value = przeliczonaKwota + " CHF";
            }
        }
    </script>
</body>
</html>
