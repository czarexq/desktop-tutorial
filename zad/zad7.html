<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokument</title>
</head>
<body>
  Podaj pierwszą liczbę: <input type="int" id="num1"> <br>
  Podaj drugą liczbę: <input type="int" id="num2"> <br>
  <label>
    <input type="radio" name="operacja" id="plus"> +
    <input type="radio" name="operacja" id="minus"> -
    <input type="radio" name="operacja" id="razy"> *
    <input type="radio" name="operacja" id="dziel"> /
  </label>
  <br>
  <button onclick="oblicz()">Oblicz</button>
  <p id="wynik"></p>

  <script>
    let plus = document.getElementById("plus");
    let minus = document.getElementById("minus");
    let razy = document.getElementById("razy");
    let dziel = document.getElementById("dziel");
    let wynik = document.getElementById("wynik");
    let num1 = document.getElementById("num1");
    let num2 = document.getElementById("num2"); 

    function oblicz() {
      if (plus.checked) {
        wynik.innerText = (+num1.value + +num2.value);
      }
      else if (minus.checked) {
        wynik.innerText = (+num1.value - +num2.value);
      }
      else if (razy.checked) {
        wynik.innerText = (+num1.value * +num2.value);
      }
      else if (dziel.checked) {
        if (num2.value == 0) {
          wynik.innerHTML = "Nie możesz dzielić przez 0";
        }
        else {
          wynik.innerText = (+num1.value / +num2.value);
        }
      }
    }

  </script>
</body>
</html>
