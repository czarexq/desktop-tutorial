<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dokument</title>
</head>
<body>
    Wpisz ilość sekund i wciśnij przycisk aby przeliczyć na godziny/minuty/sekundy<br>
    <input type="number" id="user_number"> sekund
    <button id="button1" onclick="minuty()">Minuty</button>
    <button id="buton2" onclick="godziny()">Godziny</button>
    <button id="button3" onclick="sekundy()">Sekundy</button>
    <input readonly id="wynik"> 



    <script>
        let user_number = document.getElementById("user_number");
        let wynik = document.getElementById("wynik");
        let licz = 0

        function minuty() {
            licz = +user_number.value / 60;
            let ladnie = licz.toFixed(2);
            wynik.value = ladnie +  " minut/y" ;
        }

        function godziny() {
            licz = +user_number.value / 3600;
            let ladnie = licz.toFixed(2);
            wynik.value = ladnie + " godzin/y" ;
        }

        function sekundy() {
            wynik.value = user_number.value + " sekund" ;
        }
    </script>
</body>
</html>
